[project]
name = "atendeai-ai-service"
version = "0.1.0"
description = "AI Control Plane do Atende Aí — agente de vendas, memória, RAG e policy engine"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pydantic-ai>=0.0.20",
    "psycopg[binary,pool]>=3.2",
    "litellm>=1.52",
    "langfuse>=2.53",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "anyio>=4.6",
    "ruff>=0.7",
    "pyright>=1.1.386",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ----------------------------------------------------------------------------
# Ruff
# ----------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF", "ASYNC"]
ignore = [
    # Linhas longas em docstring/comentário explicativo não valem quebrar.
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

# ----------------------------------------------------------------------------
# Pyright
# ----------------------------------------------------------------------------
[tool.pyright]
include = ["app", "tests"]
pythonVersion = "3.12"
typeCheckingMode = "standard"
reportMissingImports = true
reportUnusedImport = "warning"

# ----------------------------------------------------------------------------
# Pytest
# ----------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
# Raiz no path: os testes importam constantes de `tests.conftest`, e sem isto
# o pacote `tests` não é importável (o wheel só empacota `app`).
pythonpath = ["."]
asyncio_mode = "auto"
addopts = "-q"
markers = [
    "db: exige DATABASE_URL apontando para um Postgres real",
    "llm: exige credencial de provider (não roda no CI padrão)",
]
